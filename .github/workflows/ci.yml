name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Syntax, import and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Syntax check (all src)
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          errors = []
          files = list(pathlib.Path("src").rglob("*.py"))
          for f in files:
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f"{f}: {e}")
          if errors:
              print("Syntax errors:")
              for e in errors:
                  print(" ", e)
              sys.exit(1)
          print(f"All {len(files)} files parse OK")
          PY

      - name: Import check (server loads and registers tools)
        run: |
          cd src && python -c "import asyncio, server; print('tools:', len(asyncio.run(server.server.list_tools())))"

      - name: Run tests
        run: pytest

  manifest:
    name: Validate MCPB manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate manifest.json
        run: npx --yes @anthropic-ai/mcpb@2 validate manifest.json
